# CYG Game Server Configuration (Standard TOML)
name = "game_room"
# The registered game this process hosts. Stats and player data shown in the
# console are scoped to this tenant; another game's workspace reports that it
# is not hosted here instead of falling back to global telemetry.
game_id = "aa1cea32-77f1-4c0e-ad4b-b47f4bef64cd"
game_key = "gm_test_5312a6"
runtime = "assemblyscript"
source = "crates/engine-net/examples/e2e/room.ts"
out = "crates/engine-net/examples/e2e/room_logic.wasm"
sdk_dir = "../colyseus"
website = "crates/engine-net/examples/e2e/website.html"
port = 7777
web_port = 8090
tick_rate = 128
max_clients = 16

[control.session]
# Embedded SurrealKV keeps accounts in a local directory; point at
# `ws://host:8000` instead to use a remote SurrealDB.
database_endpoint = "surrealkv://data/cyg"
# Memory ceilings for the embedded engine, in MiB. Without them SurrealKV sizes
# itself from the host's total memory (gigabytes on a big machine); these keep
# its data memory at 96 MiB so the process fits a 500 MB container. A single
# transaction cannot exceed the memtable size. Set either to 0 for host-derived.
database_memtable_mib = 64
database_cache_mib = 32
# Uploaded blobs (WASM modules, maps) live here, not in table rows. Empty uses
# `data/uploads` next to an embedded store; a remote endpoint needs this set
# (`memory://`, `s3:/bucket?region=…&prefix=…`, or `file:<path>`).
blobs = "file:data/uploads"
server_key = "change-me"

[control.console]
username = "admin"
password = "change-me"
