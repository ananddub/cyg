# CYG Game Server Configuration (Standard TOML)
name = "game_room"
# The registered game this process hosts. Stats and player data shown in the
# console are scoped to this tenant; another game's workspace reports that it
# is not hosted here instead of falling back to global telemetry.
game_id = "aa1cea32-77f1-4c0e-ad4b-b47f4bef64cd"
game_key = "gm_test_5312a6"
runtime = "assemblyscript"
source = "crates/engine-net/examples/e2e/room.ts"
out = "crates/engine-net/examples/e2e/room_logic.wasm"
sdk_dir = "../colyseus"
website = "crates/engine-net/examples/e2e/website.html"
port = 7777
web_port = 8090
tick_rate = 128
max_clients = 16

[control.session]
database_endpoint = "ws://localhost:8000"
database_user = "root"
database_pass = "root"
database_ns = "cyg"
database_db = "cyg"
# Memory ceilings for the embedded engine, in MiB. Without them SurrealKV sizes
# itself from the host's total memory (gigabytes on a big machine); these keep
# its data memory at 96 MiB so the process fits a 500 MB container. A single
# transaction cannot exceed the memtable size. Set either to 0 for host-derived.
database_memtable_mib = 64
database_cache_mib = 32
# Uploaded blobs (WASM modules, maps) live here, not in table rows. Empty uses
# `data/uploads` next to an embedded store; a remote endpoint needs this set
# (`memory://`, `s3:/bucket?region=…&prefix=…`, or `file:<path>`).
blobs = "file:data/uploads"
server_key = "change-me"

[control.console]
username = "admin"
password = "change-me"

# In-app purchase verification. With no credentials here, purchase endpoints
# answer 503 instead of storing whatever the client sent. Fill these in for a
# store you ship through, or set `allow_unverified = true` for local testing.
[control.iap]
# apple_shared_secret = "…"
# google_service_account = '{"type":"service_account", …}'
# google_package_name = "com.example.game"
# allow_unverified = false

# Third-party sign-in for /v2/account/authenticate/{apple,facebook,google,steam}.
# A provider with no credentials stays closed: Apple and Steam answer 400
# "not configured", Google and Facebook answer 401 "could not authenticate".
# Fill these in for a provider you ship through; `allow_unverified` maps any
# token to a hashed identity and is for local development only — never ship set.
[control.social]
# google_client_ids = "android-client-id,web-client-id"
# apple_client_id = "com.example.game"
# facebook_app_id = "…"
# facebook_app_secret = "…"
# steam_app_id = 0
# steam_web_api_key = "…"
# allow_unverified = false
