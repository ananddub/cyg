apiVersion: v1
kind: Service
metadata:
  name: cyg
  namespace: cyg
  labels:
    app.kubernetes.io/name: cyg-gaming
spec:
  selector:
    app.kubernetes.io/name: cyg-gaming
    app.kubernetes.io/component: control-plane
  ports:
    - { name: http, port: 8124, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: cyg-metrics
  namespace: cyg
  labels:
    app.kubernetes.io/name: cyg-gaming
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cyg-gaming
    app.kubernetes.io/component: control-plane
  ports:
    - { name: http, port: 8124, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyg
  namespace: cyg
  annotations:
    # The dashboard and the player sockets are long-lived WebSocket
    # connections; the proxy must not time them out mid-match.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ws: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - game.example.com
      secretName: cyg-tls
  rules:
    - host: game.example.com
      http:
        paths:
          # Only the player/dashboard surface is published. `/metrics` needs the
          # server key or a console token and is scraped in-cluster through the
          # PodMonitor instead.
          - path: /
            pathType: Prefix
            backend:
              service: { name: cyg, port: { number: 8124 } }
