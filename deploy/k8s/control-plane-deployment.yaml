apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyg
  namespace: cyg
  labels:
    app.kubernetes.io/name: cyg-gaming
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cyg-gaming
      app.kubernetes.io/component: control-plane
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyg-gaming
        app.kubernetes.io/component: control-plane
    spec:
      # §3.7 drains rooms on SIGTERM; give the drain time to finish before the
      # kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cyg
          image: ghcr.io/REPLACE_ME/cyg-gaming:REPLACE_ME_TAG
          imagePullPolicy: IfNotPresent
          args: ["run", "/app/game"]
          ports:
            - { name: http, containerPort: 8124 }
          env:
            - name: RUST_LOG
              value: info
            - name: OX_LOG_FORMAT
              value: json
            # OX_ALLOW_DEFAULT_SECRETS is deliberately absent: the boot guard in
            # engine-control refuses default signing keys, seat secret, server
            # key and console password unless it is set to 1.
            - name: OX_NODE_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          envFrom:
            - secretRef:
                name: cyg-secrets
          volumeMounts:
            - name: config
              mountPath: /app/game/config.toml
              subPath: config.toml
              readOnly: true
            - name: data
              mountPath: /app/game/data
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap:
            name: cyg-config
        - name: data
          emptyDir:
            sizeLimit: 512Mi
