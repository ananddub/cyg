# TEMPLATE — copy, replace every REPLACE_ME, then `kubectl apply`. Never commit
# a filled-in copy: `git status` should never show this file as modified.
#
#   kubectl -n cyg create secret generic cyg-secrets \
#     --from-literal=OX_SIGNING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=OX_REFRESH_SIGNING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=OX_SEAT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=OX_SERVER_KEY="$(openssl rand -hex 32)" \
#     --from-literal=OX_CONSOLE_SIGNING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=OX_CONSOLE_USERNAME=release-admin \
#     --from-literal=OX_CONSOLE_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=SURREAL_USER=root \
#     --from-literal=SURREAL_PASS="$(openssl rand -base64 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Rotation: the keys above are re-read at pod start, so a rollout
# (`kubectl -n cyg rollout restart deployment/cyg`) after updating the Secret is
# the whole procedure. docs/SECRETS.md covers the dual-key window that lets
# already-issued tokens survive the restart.
apiVersion: v1
kind: Secret
metadata:
  name: cyg-secrets
  namespace: cyg
type: Opaque
stringData:
  OX_SIGNING_KEY: REPLACE_ME
  OX_REFRESH_SIGNING_KEY: REPLACE_ME
  OX_SEAT_SECRET: REPLACE_ME
  OX_SERVER_KEY: REPLACE_ME
  OX_CONSOLE_SIGNING_KEY: REPLACE_ME
  OX_CONSOLE_USERNAME: REPLACE_ME
  OX_CONSOLE_PASSWORD: REPLACE_ME
  SURREAL_USER: root
  SURREAL_PASS: REPLACE_ME
