name = "CYG"
grammar = "cyg"
path_suffixes = ["cyg"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 4
autoclose_before = ";,:)]}>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "<", end = ">", close = true, newline = false },
]
