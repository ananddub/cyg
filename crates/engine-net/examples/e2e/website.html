<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CookYourGame — PvP Arena</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000000; color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh; padding: 24px;
        -webkit-font-smoothing: antialiased;
    }
    .header-bar {
        display: flex; align-items: center; justify-content: space-between;
        width: 800px; margin-bottom: 14px;
    }
    h1 {
        font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em;
        color: #fafafa; display: flex; align-items: center; gap: 8px;
    }
    h1 span.badge-pill {
        font-size: 0.7rem; font-weight: 500; letter-spacing: 0;
        background: #18181b; border: 1px solid #27272a;
        color: #a1a1aa; padding: 2px 8px; border-radius: 9999px;
    }
    #status {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 0.8rem; font-weight: 500; color: #71717a;
        background: #09090b; border: 1px solid #27272a;
        padding: 3px 10px; border-radius: 9999px;
    }
    #status::before {
        content: ''; width: 6px; height: 6px; border-radius: 50%;
        background: #71717a; display: inline-block;
    }
    #status.ok { color: #e4e4e7; border-color: #3f3f46; }
    #status.ok::before { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    canvas {
        background: #09090b;
        border: 1px solid #27272a;
        border-radius: 12px;
        cursor: crosshair;
        box-shadow: 0 20px 40px -15px rgba(0,0,0,0.9);
    }
    #hud { 
        margin-top: 14px; font-size: 0.85rem; color: #71717a; 
        display: flex; gap: 20px; align-items: center; justify-content: space-between;
        background: #09090b; padding: 10px 20px; border-radius: 10px;
        border: 1px solid #27272a; width: 800px;
    }
    .hud-metrics { display: flex; gap: 18px; align-items: center; }
    .hud-metrics div { font-variant-numeric: tabular-nums; }
    #hud b { color: #ffffff; font-weight: 600; margin-left: 2px; }
    .badge {
        font-size: 0.75rem; background: #18181b; padding: 4px 10px;
        border-radius: 6px; border: 1px solid #27272a; color: #a1a1aa;
    }
</style>
<!-- Live demo, zero build: two-step join against the control plane —
     POST {api}/api/matchmake/joinOrCreate/<room> for a seat reservation, then
     the SDK dials ws://host:gamePort/{processId}/{roomId}?sessionId=… with the
     seat's tokens (client.consumeSeatReservation). Falls back to a plain
     client.joinOrCreate on the game WS port for ?host/?port/?endpoint or when
     the plane is unreachable. -->
<!-- The SDK bundle imports "@colyseus/schema" — resolve it to the local build. -->
<script type="importmap">
    { "imports": { "@colyseus/schema": "./node_modules/@colyseus/schema/build/index.mjs" } }
</script>
<!-- Official @colyseus/sdk (self-contained UMD build of this monorepo). -->
<script type="module" src="./packages/sdk/dist/colyseus.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => {
            for (const r of rs) r.unregister();
        });
    }
</script>
</head>
<body>
    <div class="header-bar">
        <h1>CookYourGame <span>Arena</span> <span class="badge-pill">PvP 128Hz</span></h1>
        <div id="status">connecting…</div>
    </div>
    <canvas id="game" width="800" height="500"></canvas>
    <div id="hud">
        <div class="hud-metrics">
            <div>HP <b id="hp" style="color:#ffffff">100</b></div>
            <div>Score <b id="score">0</b></div>
            <div>Players <b id="players">–</b></div>
            <div>Bullets <b id="bullets">0</b></div>
            <div>Tick <b id="tick">–</b></div>
            <div>Room <b id="roomid">–</b></div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="badge" id="matchstat" hidden></div>
            <div class="badge">WASD Move • Space/Click Shoot</div>
        </div>
    </div>

<script type="module">
    const statusEl = document.getElementById('status');
    const tickEl = document.getElementById('tick');
    const playersEl = document.getElementById('players');
    const hpEl = document.getElementById('hp');
    const scoreEl = document.getElementById('score');
    const bulletsEl = document.getElementById('bullets');
    const roomEl = document.getElementById('roomid');
    const matchstatEl = document.getElementById('matchstat');
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const COLORS = ['#4ade80', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa', '#f87171', '#38bdf8', '#fb923c'];

    let room = null;
    let myPlayerId = null;
    let players = [];
    let bullets = [];
    let coinX = 400;
    let coinY = 250;
    let tickCount = 0;
    const keys = {};
    let mouseX = 400;
    let mouseY = 250;
    let isMouseDown = false;

    const params = new URLSearchParams(window.location.search);
    const pageHost = (location.hostname === '0.0.0.0' || !location.hostname)
        ? '127.0.0.1' : location.hostname;
    // Room name; the engine accepts 1-64 letters/digits/'-'/'_' (reserve.rs).
    const roomName = (params.get('room') || 'game_room').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64) || 'game_room';

    // The control plane (matchmake, /status, /api/rooms, statics) answers on
    // engine-config's api_port — default 8124. When the engine itself serves
    // this page, same-origin IS that plane, so prefer it; ?api= overrides.
    const apiBase = (() => {
        if (params.has('api')) {
            let a = params.get('api');
            if (!/^https?:\/\//.test(a)) a = `${location.protocol}//${a}`;
            return a.replace(/\/+$/, '');
        }
        if (location.protocol === 'http:' || location.protocol === 'https:') {
            return location.origin;
        }
        return `http://${pageHost}:8124`;
    })();

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', e => {
        if (e.button === 0) {
            isMouseDown = true;
            sendInput();
        }
    });

    window.addEventListener('mouseup', e => {
        if (e.button === 0) isMouseDown = false;
    });

    window.addEventListener('keydown', e => {
        if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
            keys[e.code] = true;
            e.preventDefault();
            sendInput();
        }
    });

    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });

    function sendInput() {
        if (!room) return;
        let flags = 0;
        if (keys['KeyW'] || keys['ArrowUp']) flags |= 1;
        if (keys['KeyS'] || keys['ArrowDown']) flags |= 2;
        if (keys['KeyA'] || keys['ArrowLeft']) flags |= 4;
        if (keys['KeyD'] || keys['ArrowRight']) flags |= 8;
        if (isMouseDown || keys['Space']) flags |= 16;

        let angle = 0;
        const me = players.find(p => p.id === myPlayerId);
        if (me) {
            angle = Math.atan2(mouseY - me.y, mouseX - me.x);
        }

        const buf = new ArrayBuffer(8);
        const view = new DataView(buf);
        view.setUint32(0, flags, true);
        view.setFloat32(4, angle, true);
        room.sendBytes('input', new Uint8Array(buf));
    }
    setInterval(sendInput, 25);

    // Every engine REST refusal carries the reference-shaped envelope
    // {"error":{"code":<grpc n>,"message":"…","details":[…]}} (error/api.rs);
    // the raw game WS port answers the older {"code":…,"error":"…"} shape
    // instead. Non-JSON (a static server's 404 page) falls back to the bare
    // status code, so the pill never shows "[object Object]".
    async function describeHttpError(res) {
        let detail = null;
        try {
            const body = await res.json();
            if (body && typeof body.error === 'object' && body.error !== null) {
                detail = body.error.message || `error code ${body.error.code}`;
            } else if (body && typeof body.error === 'string') {
                detail = `${body.error} (code ${body.code})`;
            }
        } catch (_) { /* not JSON */ }
        return `HTTP ${res.status}${detail ? ` — ${detail}` : ''}`;
    }

    // Step 1 of the real flow: POST the control plane's matchmake. An empty
    // "{}" body is all joinOrCreate needs (reserve.rs mints the seat from the
    // URL + rate-limit bucket alone). The reply is the seat reservation
    // dto/matchmake.rs prints: name/sessionId/roomId/processId/
    // reconnectionToken/seatToken/gamePort/controlPort/expiresAt/iceServers.
    async function fetchSeat() {
        const res = await fetch(`${apiBase}/api/matchmake/joinOrCreate/${roomName}`, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: '{}',
        });
        if (!res.ok) throw new Error(await describeHttpError(res));
        const seat = await res.json();
        if (!seat || !seat.roomId || !seat.sessionId || !seat.processId) {
            throw new Error('malformed seat reservation');
        }
        return seat;
    }

    // Back-compat affordances: ?endpoint=, or ?host=/?port=, still hand the
    // SDK a bare WS endpoint and it runs the game port's own
    // /matchmake → upgrade handshake, exactly like test-client/sdk_e2e.mjs.
    function directEndpoint(isHttps) {
        const wsProto = isHttps ? 'wss:' : 'ws:';
        if (params.has('endpoint')) return params.get('endpoint');
        if (params.has('host')) {
            const h = params.get('host');
            const p = params.get('port') || (isHttps ? '443' : '7777');
            return `${wsProto}//${h}${p && p !== '80' && p !== '443' ? ':' + p : ''}`;
        }
        if (isHttps) {
            // Tunnel / HTTPS (Dev Tunnels, ngrok, cloudflare) — one host serves
            // both planes; connect straight to the current origin over WSS.
            return `${wsProto}//${location.host}`;
        }
        return `${wsProto}//${pageHost}:${params.get('port') || '7777'}`;
    }

    async function join() {
        const isHttps = location.protocol === 'https:';
        const useControlPlane = !params.has('endpoint') && !params.has('host') && !isHttps;

        let seat = null;
        let seatError = null;
        if (useControlPlane) {
            statusEl.textContent = `matchmaking via ${apiBase}…`;
            try {
                seat = await fetchSeat();
            } catch (e) {
                seatError = e;
            }
        }

        if (seat) {
            // Step 2: pass the reservation to the SDK and dial the game WS port
            // it names. consumeSeatReservation builds the upgrade URL itself:
            // ws://host:gamePort/{processId}/{roomId}?sessionId=…&reconnectionToken=…,
            // which is what the engine's transport adopts (upgrade.rs / request.rs).
            const wsProto = isHttps ? 'wss:' : 'ws:';
            const seatHost = seat.publicAddress || pageHost;
            const seatPort = seat.gamePort || 7777;
            const client = new Colyseus.Client(`${wsProto}//${seatHost}:${seatPort}`);
            room = await client.consumeSeatReservation(seat);
        } else {
            const endpoint = directEndpoint(isHttps);
            statusEl.textContent = seatError
                ? `matchmake failed (${seatError.message}) — joining ${endpoint} directly…`
                : `connecting to ${endpoint}…`;
            const client = new Colyseus.Client(endpoint);
            room = await client.joinOrCreate(roomName);
        }

        roomEl.textContent = room.roomId || roomName;

        room.onMessage("delta", (bytes) => {
            tickCount++;

            // Layout (room.ts tick + netcode::wrap_delta_into):
            // [i64 yourPlayerId][u32 players][{i64 id,f64 x,f64 y,f64 score,f64 hp}…]
            // [f64 coinX,f64 coinY][u32 bullets]{f64 x,f64 y,i64 ownerId}…
            // …then the authoritative tail: [acked_seq u16][server_tick u32].
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            myPlayerId = view.getBigInt64(0, true);
            statusEl.textContent = `connected — you are player #${myPlayerId} — WASD move, CLICK to shoot!`;
            statusEl.classList.add('ok');

            let offset = 8;
            const count = view.getUint32(offset, true);
            offset += 4;

            const list = [];
            for (let i = 0; i < count; i++) {
                const id = view.getBigInt64(offset, true);
                offset += 8;
                const x = view.getFloat64(offset, true);
                offset += 8;
                const y = view.getFloat64(offset, true);
                offset += 8;
                const score = view.getFloat64(offset, true);
                offset += 8;
                const hp = view.getFloat64(offset, true);
                offset += 8;
                list.push({ id, x, y, score, hp });
            }
            players = list;
            playersEl.textContent = count;

            coinX = view.getFloat64(offset, true);
            offset += 8;
            coinY = view.getFloat64(offset, true);
            offset += 8;

            const bCount = view.getUint32(offset, true);
            offset += 4;

            const bList = [];
            for (let i = 0; i < bCount; i++) {
                const bx = view.getFloat64(offset, true);
                offset += 8;
                const by = view.getFloat64(offset, true);
                offset += 8;
                const ownerId = view.getBigInt64(offset, true);
                offset += 8;
                bList.push({ x: bx, y: by, ownerId });
            }
            bullets = bList;
            bulletsEl.textContent = bCount;

            // Authoritative tail (netcode::wrap_delta_into): [acked_seq u16]
            // [server_tick u32]. Count-driven decoders stop before it; show the
            // real server tick when present, the local delta counter otherwise.
            if (bytes.byteLength >= offset + 6) {
                tickEl.textContent = view.getUint32(offset + 2, true);
            } else {
                tickEl.textContent = tickCount;
            }

            const me = players.find(p => p.id === myPlayerId);
            if (me) {
                const roundedHp = Math.max(0, Math.round(me.hp));
                hpEl.textContent = roundedHp;
                scoreEl.textContent = Math.round(me.score);
                if (roundedHp <= 30) hpEl.style.color = '#ef4444';
                else if (roundedHp <= 60) hpEl.style.color = '#eab308';
                else hpEl.style.color = '#4ade80';
            }
        });

        room.onLeave(() => {
            statusEl.textContent = 'disconnected — reloading…';
            statusEl.classList.remove('ok');
            setTimeout(() => location.reload(), 1500);
        });
    }

    join().catch(err => {
        statusEl.textContent = 'failed: ' + (err?.message ?? err);
    });

    // Honest server-side occupancy: GET /api/rooms is the player-visible
    // telemetry endpoint (no auth, status.rs). /v2/match and
    // /v2/matchmaker/stats exist but are session-gated, so this token-less
    // demo cannot call them. Silently keeps the last value — and stays hidden
    // entirely — when no engine plane answers.
    async function pollRooms() {
        try {
            const res = await fetch(`${apiBase}/api/rooms`, { headers: { Accept: 'application/json' } });
            if (!res.ok) return;
            const list = await res.json();
            if (!Array.isArray(list) || list.length === 0) return;
            const mine = list.find(r => r.name === roomName) || list[0];
            matchstatEl.textContent = `server: ${mine.clients ?? '?'}/${mine.maxClients ?? '?'} @ ${mine.tickHz ?? '?'} Hz`;
            matchstatEl.hidden = false;
        } catch (_) { /* static file server, cross-origin, or no control plane */ }
    }
    pollRooms();
    setInterval(pollRooms, 5000);

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // grid
        ctx.strokeStyle = '#18181b';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Golden coin
        if (coinX > 0 && coinY > 0) {
            ctx.beginPath();
            ctx.arc(coinX, coinY, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbf2433';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(coinX, coinY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbf24';
            ctx.fill();
        }

        // Bullets
        for (let i = 0; i < bullets.length; i++) {
            const b = bullets[i];
            const isMine = myPlayerId !== null && b.ownerId === myPlayerId;

            ctx.beginPath();
            ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = isMine ? 'rgba(56, 189, 248, 0.35)' : 'rgba(248, 113, 113, 0.35)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = isMine ? '#38bdf8' : '#f87171';
            ctx.fill();
        }

        // Players
        for (let i = 0; i < players.length; i++) {
            const p = players[i];
            const color = COLORS[Number(p.id % BigInt(COLORS.length))];
            const px = Math.max(14, Math.min(canvas.width - 14, p.x));
            const py = Math.max(14, Math.min(canvas.height - 14, p.y));
            const isMe = myPlayerId !== null && p.id === myPlayerId;

            // Gun Barrel
            const angle = isMe ? Math.atan2(mouseY - py, mouseX - px) : 0;
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(angle);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(6, -2.5, 12, 5);
            ctx.restore();

            // Glow
            ctx.beginPath();
            ctx.arc(px, py, 16, 0, Math.PI * 2);
            ctx.fillStyle = color + '22';
            ctx.fill();

            // Body
            ctx.beginPath();
            ctx.arc(px, py, 11, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            // White ring for local player
            if (isMe) {
                ctx.beginPath();
                ctx.arc(px, py, 14, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Aim laser sight
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Health bar
            const barW = 34;
            const barH = 5;
            const barX = px - barW / 2;
            const barY = py - 24;
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(barX, barY, barW, barH);
            const hpRatio = Math.max(0, Math.min(1, p.hp / 100));
            ctx.fillStyle = hpRatio > 0.6 ? '#22c55e' : hpRatio > 0.3 ? '#eab308' : '#ef4444';
            ctx.fillRect(barX, barY, barW * hpRatio, barH);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barW, barH);

            // Label with score
            ctx.fillStyle = isMe ? '#ffffff' : '#94a3b8';
            ctx.font = 'bold 11px monospace';
            ctx.textAlign = 'center';
            const label = (isMe ? 'YOU' : `P${p.id}`) + (p.score > 0 ? ` [${Math.round(p.score)}]` : '');
            ctx.fillText(label, px, py - 30);
        }

        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
