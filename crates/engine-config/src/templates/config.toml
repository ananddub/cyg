# ox-game configuration (TOML)
name = "my-game"

# Runtime used to compile your room source into WebAssembly.
# Supported: assemblyscript, lua, cpp, rust, csharp
runtime = "assemblyscript"

# Your room logic source + compiled output (relative to this folder).
source = "src/index.ts"
out = "room_logic.wasm"

# Legacy Colyseus bundle directory. New projects should use the bundled
# CYG web SDK (`cyg.js`) and can leave this empty.
sdk_dir = ""

port = 7777
web_port = 8090
# 30 Hz is the easy-mode default; use 20 for slower/casual rooms or 60/128 for
# competitive/rollback games.
tick_rate = 30
max_clients = 16
max_rooms = 1024
# Per-client message budget per second; a client exceeding it is kicked (0 = off).
max_messages_per_second = 0
# Synthetic round-trip latency (ms) for local testing; app data both ways is
# delayed by half of this. 0 = off.
simulate_latency_ms = 0

# Playfield
width = 800.0
height = 500.0
speed = 240.0

# CYG ABI Contract & Permissions
abi_version = 1
allow_physics = true
allow_lag_compensation = true
allow_logging = true
allow_storage = true
allow_messaging = true

# Room lifetime. Every value is the window the host shipped as a hardcoded
# literal, so leaving this block out changes nothing.
#   room_max_seconds — 0 = a room lives until it empties; set it for
#                      match-bounded genres so a leaked room cannot pile up.
#   reap_idle_secs   — dispose a room this long after its last player left.
#   peer_idle_ms     — drop a raw UDP peer silent this long.
#   seat_hold_secs   — ceiling for `allowReconnection`, whatever the room asks.
#   persistent_rooms — names never reaped for being empty (a lobby or hub).
#   drain_grace_secs — how long the host keeps simulating after SIGTERM so peers
#                      are told to leave and their rooms are saved. Keep it under
#                      the pod's terminationGracePeriodSeconds.
# [lifecycle]
# room_max_seconds = 0
# reap_idle_secs = 30
# peer_idle_ms = 3000
# seat_hold_secs = 120
# persistent_rooms = ["lobby"]
# drain_grace_secs = 15

# Guest-timeout fuse. Room logic runs in this process, so a guest stuck in a
# loop would stop the host loop and every other room on it; the engine cuts such
# a call off instead. The room is not closed — its next call re-arms the fuse.
#   enabled              — false = old behaviour, a stuck guest hangs the process.
#   tick_budget_ms       — longest one guest call may run. A 30 Hz `on_tick`
#                          needs ~33 ms, so this is a fuse, not a rate limit.
#   epoch_deadline_ticks — how many slices the budget is checked on.
#   max_ticks_per_frame  — how many ticks one pass may simulate after falling
#                          behind. Catching up twenty ticks at once would freeze
#                          the lobby for everyone else, so the backlog is dropped.
# [watchdog]
# enabled = true
# tick_budget_ms = 500
# epoch_deadline_ticks = 4
# max_ticks_per_frame = 3

# Event history. `host_send` messages are wire-only by default; listing an event
# name here mirrors it to the control plane, where it is written to the
# gameplay_event table and readable per match. Names are the game's own.
#   result_event — the guest event whose last payload the host files as the
#                  finished match's outcome, so a history listing can show who
#                  won without replaying the room. Defaults to "match_result".
# [gameplay]
# record_events = ["discard", "deal", "match_end"]
# event_ttl_days = 30
# match_history_ttl_days = 90
# result_event = "match_result"

# Control plane (Tokio/Axum): matchmake, WS signaling, /status, statics.
# `api_port` is its own port so the game WebSocket (`port`) and the website
# (`web_port`) keep working unchanged. Set `api_port = web_port` to hand the
# website port over to Axum entirely.
[control]
enabled = true
bind_addr = "0.0.0.0"
api_port = 8124
workers = 2
seat_ttl_secs = 300
rate_limit_rps = 20
rate_limit_burst = 40
# seat_secret = "change-me"   # prefer the OX_SEAT_SECRET environment variable

# Per-player quotas. Each charged route spends from a named window, and the
# over-cap refusal carries a Retry-After. Off until a game opts in: a cap that
# fires on chat or storage writes is an operator's decision.
# player_rps/player_burst is the in-process bucket every authenticated request
# passes through; the windows below are the durable per-account budgets.
[control.quotas]
enabled = false
exempt_console = true
player_rps = 20
player_burst = 40
# A scope key is either a cap (keeping that scope's window) or a table:
# login = 20
# [control.quotas."channel.send"]
# cap = 60
# period_secs = 60
# default_cap = 60          # window for a scope nobody listed
# default_window_secs = 60

# Agones sidecar lifecycle: Ready, Allocated and the Health ping loop.
[control.agones]
enabled = false
http_port = 9358
health_interval_ms = 2000
host = "127.0.0.1"

# BaaS-compatible account plane (/v2/account/*). Defaults match the own
# config.yaml, so an unmodified BaaS SDK works unchanged.
# The endpoint selects the storage engine: `surrealkv://data/cyg` runs embedded
# (single process), `ws://host:8000` connects to a remote SurrealDB (cloud).
# Leave it empty (or unset SURREAL_ENDPOINT) to keep the game running with no
# accounts database; /v2 then answers 503.
[control.session]
database_endpoint = ""
database_ns = "cyg"
database_db = "cyg"
# database_user = "root"
# database_pass = "…"
# SurrealKV's memory ceilings in MiB (embedded endpoints only). The engine
# would otherwise size itself from the *host's* memory — gigabytes of memtable
# and cache on a large machine. These defaults hold the engine's data memory to
# 96 MiB, which is what lets the whole process run in a 500 MB container. A
# single transaction cannot exceed the memtable. `0` restores host-derived sizing.
# database_memtable_mib = 64
# database_cache_mib = 32
# Where uploaded blobs (WASM room modules, maps) are stored. `file:data/uploads`
# keeps them on local disk; `memory://` or an `s3:/bucket?…` URL uses a
# SurrealDB bucket instead. Empty picks the embedded default: memory under
# `mem://`, `data/uploads` next to a `surrealkv://` store, and nothing under a
# remote endpoint (uploads then answer 503 until this is set).
# blobs = "file:data/uploads"
signing_key = "defaultsigningkey"
refresh_signing_key = "defaultrefreshsigningkey"
# Basic-auth credential the SDK sends on Authenticate* and SessionRefresh.
server_key = "defaultkey"
token_expires_sec = 60
refresh_token_expires_sec = 3600

# Admin console (/dashboard): its own login, separate from player sessions.
# `console_user` rows in the database are checked first; username/password below
# is the bootstrap superadmin for a fresh database. Change both before shipping.
[control.console]
username = "admin"
password = "password"
signing_key = "defaultconsolesigningkey"
token_expires_sec = 3600

# In-app purchase verification. A purchase is recorded only after the store's
# own API confirms it. Apple needs the app-specific shared secret; Google needs
# a service-account JSON key and the Android package name. A store with no
# credentials answers 503 instead of trusting the client. `allow_unverified`
# records client claims and is for local development only — never ship it set.
[control.iap]
# apple_shared_secret = "…"
# google_service_account = '{"type":"service_account", …}'
# google_package_name = "com.example.game"
# allow_unverified = false

# Third-party sign-in (/v2/account/authenticate/{apple,facebook,google,steam}).
# A provider with no credentials stays closed: Apple and Steam answer 400
# "not configured", Google and Facebook answer 401 "could not authenticate".
# `allow_unverified` maps any token to a hashed identity and is for local
# development only — never ship it set.
[control.social]
# google_client_ids = "android-client-id,web-client-id"
# apple_client_id = "com.example.game"
# facebook_app_id = "…"
# facebook_app_secret = "…"
# steam_app_id = 0
# steam_web_api_key = "…"
# allow_unverified = false
