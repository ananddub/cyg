[package]
name = "engine-api"
version = "0.1.0"
edition = "2024"
description = "Browser-facing HTTP and WebSocket surface: matchmake, signaling, telemetry routes, dashboard, static website"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
engine-agones = { path = "../engine-agones" }
engine-bus = { path = "../engine-bus" }
engine-config = { path = "../engine-config" }
engine-dashboard = { path = "../engine-dashboard" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
# `sha1` is what HMAC needs for the TOTP second factor (RFC 6238); the 0.10 line is
# the one `hmac` 0.12 is built against, and axum already pulls it in.
sha1 = "0.10"
axum = { version = "0.8", features = ["ws", "multipart"] }
# Upload ABI validation: enumerate a module's exports and full-validate its
# bytes without spinning up a Cranelift compile — the same 0.217 line the
# workspace's wasmtime already depends on.
wasmparser = "0.217"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "signal", "fs"] }
crossbeam-channel = "0.5"
rust-embed = "8.5"
# Typed SurrealDB layer: derive macros, schema generation, query builders and
# migrations. Execution is ours (`src/db`), so the connection stays a single
# `Surreal<Any>` — embedded engines allow only one handle per process.
somnia = "0.8.1"
# `#[derive(SurrealRecord)]` expands to `::somnia_core::…` paths, so the core
# crate has to be in this crate's extern prelude as well.
somnia-core = "0.8.1"
surrealdb = { version = "3.3", features = ["kv-surrealkv", "kv-mem"] }
# The SDK's embedded endpoint passes no storage configuration, so the engine
# sizes itself from the *host's* memory. `db::exec` opens SurrealKV through
# this builder instead, which is the only public interface that reaches
# `SurrealKvConfig`. Both crates are released in lockstep with `surrealdb`.
surrealdb-core = { version = "3.3", default-features = false }
surrealdb-cnf = { version = "3.3", default-features = false }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
# Auto-discovered routing: `#[controller]`/`#[get]` macros register routes
# through the compile-time inventory registry instead of a hand-written
# router() per group.
auto_route = { path = "../auto/route" }
# Auto-discovered sockets: `#[auto_ws("/ws")]` declares a websocket and its
# `#[on("event")]` handlers, mounted onto the same router.
auto_ws = { path = "../auto/ws" }
auto-di = "0.6"
rand = "0.8"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
# Base32: the encoding every authenticator app and `otpauth://` URI expects.
data-encoding = "2"
scc = "3.8"
ahash = "0.8"
arc-swap = "1.9.2"
rustrict = "0.7.39"
# Store-side IAP verification and the Google OAuth token grant. rustls keeps the
# container free of an OpenSSL runtime dependency.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2"] }

[dev-dependencies]
# Same version axum's `ws` feature already pins, for the live-socket test.
tokio-tungstenite = "0.29"
# Only for asserting the auto-registered controller actually dispatches.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
# Captures the engine's own "Setting max memtable size" / "Setting block cache
# capacity" lines, the only observable proof the budget reached SurrealKV.
tracing-subscriber = "0.3"
