[package]
name = "engine-api"
version = "0.1.0"
edition = "2024"
description = "Browser-facing HTTP and WebSocket surface: matchmake, signaling, telemetry routes, dashboard, static website"

[dependencies]
engine-agones = { path = "../engine-agones" }
engine-bus = { path = "../engine-bus" }
engine-config = { path = "../engine-config" }
engine-dashboard = { path = "../engine-dashboard" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
# `sha1` is what HMAC needs for the TOTP second factor (RFC 6238); the 0.10 line is
# the one `hmac` 0.12 is built against, and axum already pulls it in.
sha1 = "0.10"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "signal"] }
crossbeam-channel = "0.5"
rust-embed = "8.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
# Auto-discovered routing: `#[controller]`/`#[get]` macros register routes
# through the compile-time inventory registry instead of a hand-written
# router() per group.
auto_route = { path = "../auto/route" }
# Auto-discovered sockets: `#[auto_ws("/ws")]` declares a websocket and its
# `#[on("event")]` handlers, mounted onto the same router.
auto_ws = { path = "../auto/ws" }
auto-di = "0.6"
rand = "0.8"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
# Base32: the encoding every authenticator app and `otpauth://` URI expects.
data-encoding = "2"

[dev-dependencies]
# Same version axum's `ws` feature already pins, for the live-socket test.
tokio-tungstenite = "0.29"
# Only for asserting the auto-registered controller actually dispatches.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
