[package]
name = "engine-server"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy_ecs = { version = "0.15", default-features = false }
engine-core = { path = "../engine-core" }
engine-bus = { path = "../engine-bus" }
engine-config = { path = "../engine-config" }
engine-dashboard = { path = "../engine-dashboard" }
engine-wasm = { path = "../engine-wasm" }
engine-net = { path = "../engine-net" }
engine-schema = { path = "../engine-schema" }
engine-physics = { path = "../engine-physics" }
rapier3d = "0.36"
rapier2d = "0.36"
engine-spatial = { path = "../engine-spatial" }
engine-nav = { path = "../engine-nav" }
engine-api = { path = "../engine-api" }
engine-voice = { path = "../engine-voice" }
engine-webrtc-protocol = { path = "../engine-webrtc-protocol" }
bytes = "1.10"
mio = { version = "1.2.4", features = ["net", "os-poll"] }
wasmtime = "25.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "signal"] }
crossbeam-channel = "0.5"
arc-swap = "1.9.2"
scc = "3.8"
