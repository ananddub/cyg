[package]
name = "engine-control"
version = "0.1.0"
edition = "2024"
description = "Control plane runtime: the Tokio runtime, the bound listener, background tasks and the Agones lifecycle"

[dependencies]
tracing = "0.1"
engine-agones = { path = "../engine-agones" }
engine-api = { path = "../engine-api" }
engine-bus = { path = "../engine-bus" }
engine-config = { path = "../engine-config" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "signal"] }

[dev-dependencies]
serde_json = "1.0"
