[package]
name = "engine-protocol"
version = "0.1.0"
edition = "2024"
description = "Ultra-compact binary serialization (Bitcode & Postcard) for OpenOxide network state"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bitcode = { version = "0.6", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }

[dev-dependencies]
serde_json = "1.0"
