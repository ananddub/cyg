# CD — a tag publishes what the tag says it is.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# produces, on the GitHub release for that tag:
#   * `cyg-<triple>.tar.gz` / `.zip` for linux x64+arm64, macOS arm64, Windows x64
#   * `ghcr.io/<owner>/<repo>:v0.2.0`, plus a multi-arch `:latest`
#
# Nothing is published from a branch, and nothing is published if the tests
# this workflow runs first do not pass.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Distribution builds carry neither this machine's CPU nor its linker flags.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  verify:
    name: tests before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@beta

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-verify

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the console bundle the API embeds
        run: cd dashboard && npm ci && npm run build

      - name: API plane
        env:
          RUST_MIN_STACK: "16777216"
        run: |
          cargo test -p engine-api --lib --locked
          cargo test -p engine-api --tests --locked --no-fail-fast

  binaries:
    name: binary (${{ matrix.name }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@beta
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the console bundle the API embeds
        shell: bash
        run: cd dashboard && npm ci && npm run build

      - name: Build
        shell: bash
        run: cargo build --release --locked --bin cyg-gaming --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="cyg-${{ matrix.target }}"
          mkdir -p "dist/$name"
          suffix=""
          [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && suffix=".exe"
          cp "target/${{ matrix.target }}/release/cyg-gaming$suffix" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
            echo "asset=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "dist/$name.tar.gz" -C dist "$name"
            echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
        id: package

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true

  image:
    name: container image
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
