name: Release

# A version tag ships binaries for every desktop platform:
#   git tag v0.1.0 && git push origin v0.1.0
# → GitHub Release with cyg-gaming for Linux, Windows and macOS (Intel + Apple Silicon).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} --bin cyg-gaming

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          DIR="cyg-gaming-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/cyg-gaming" "$DIR/"
          cp README.md LICENSE "$DIR/"
          tar czf "cyg-gaming-${{ matrix.target }}.tar.gz" "$DIR"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "cyg-gaming-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cyg-gaming.exe" $dir
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "cyg-gaming-${{ matrix.target }}.zip"

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cyg-gaming-${{ matrix.target }}.*
          generate_release_notes: true
