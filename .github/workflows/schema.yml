name: schema

on:
  push:
    paths:
      - "crates/engine-schema/**"
      - "src/schema.rs"
      - "src/main.rs"
      - "sdk/web/**"
      - "sdk/native/**"
      - "sdk/godot/**"
      - "sdk/unity/Runtime/Schema/**"
      - "bench/loadtest.mjs"
      - ".github/workflows/schema.yml"
  pull_request:
    paths:
      - "crates/engine-schema/**"
      - "src/schema.rs"
      - "src/main.rs"
      - "sdk/web/**"
      - "sdk/native/**"
      - "sdk/godot/**"
      - "sdk/unity/Runtime/Schema/**"
      - "bench/loadtest.mjs"
      - ".github/workflows/schema.yml"

permissions:
  contents: read

jobs:
  contract:
    name: schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust schema tests
        run: cargo test -p engine-schema

      - name: CLI compiles
        run: cargo check -p cyg-gaming --bin cyg-gaming

      - name: Browser SDK syntax
        run: node --check sdk/web/cyg.js

      - name: Browser schema tests
        run: node sdk/web/test/schema.test.mjs

      - name: Schema benchmark compiles and runs
        run: cargo run -q -p engine-schema --release --example schema_bench

  native-decoders:
    name: native schema decoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C++ decoder tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O1 \
            -I sdk/native/cpp \
            sdk/native/cpp/test/schema_decoder_test.cpp \
            -o /tmp/schema_decoder_test
          /tmp/schema_decoder_test

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Lua decoder tests
        run: luajit sdk/native/lua/test/schema_decoder_test.lua

      # The GDScript decoder needs a Godot 4 binary; run it locally with:
      #   godot --headless --path sdk/godot -s res://test/schema_decoder_test.gd
