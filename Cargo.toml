[workspace]
resolver = "2"
members = [
    ".",
    "crates/engine-agones",
    "crates/engine-core",
    "crates/engine-dashboard",
    "crates/engine-guest",
    "crates/engine-http",
    "crates/engine-net",
    "crates/engine-wasm",
    "crates/engine-websocket",
    "crates/engine-webtransport",
]

[package]
name = "openoxide-gaming"
version = "0.1.0"
edition = "2024"


[dependencies]
engine-core = { path = "crates/engine-core" }
engine-http = { path = "crates/engine-http" }
engine-net = { path = "crates/engine-net" }
engine-wasm = { path = "crates/engine-wasm" }
mio = { version = "1.2.4", features = ["net", "os-poll"] }
wasmtime = "25.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


