[workspace]
resolver = "2"
members = [
    ".",
    "crates/engine-agones",
    "crates/engine-api",
    "crates/engine-bus",
    "crates/engine-config",
    "crates/engine-control",
    "crates/engine-core",
    "crates/engine-dashboard",
    "crates/engine-net",
    "crates/engine-nav",
    "crates/engine-physics",
    "crates/engine-schema",
    "crates/engine-server",
    "crates/engine-spatial",
    "crates/engine-wasm",
    "crates/engine-webrtc-protocol",
    "crates/engine-voice", "crates/test-datafusion",
    "crates/auto/route",
    "crates/auto/route_macros",
    "crates/auto/socket",
    "crates/auto/socket_macros",
    "crates/auto/ws",
    "crates/auto/ws_macros",
]

[package]
name = "cyg-gaming"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OTLP trace export. Off by default: `--features otel` adds the bridge and the
# HTTP/protobuf exporter, so a plain build keeps the old dependency graph.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
engine-bus = { path = "crates/engine-bus" }
engine-api = { path = "crates/engine-api" }
engine-config = { path = "crates/engine-config" }
engine-control = { path = "crates/engine-control" }
engine-server = { path = "crates/engine-server" }
engine-physics = { path = "crates/engine-physics" }
engine-schema = { path = "crates/engine-schema" }
engine-spatial = { path = "crates/engine-spatial" }
engine-wasm = { path = "crates/engine-wasm" }
wasmtime = "50.0.0"
hmac = "0.13.0"
sha2 = "0.11.1"
gltf = "1.4"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
flate2 = "1"
chrono = "0.4"
serde_json = "1"


# Heap profiler for allocation break-downs (`cargo build --features dhat`, OX_DHAT_SECS=n exits cleanly)
dhat = { version = "0.3", optional = true }

[dev-dependencies]
engine-core = { path = "crates/engine-core" }
engine-nav = { path = "crates/engine-nav" }
bevy_ecs = { version = "0.15", default-features = false }
rapier3d = "0.36"
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[features]
default = []
# `cargo build --features otel` (+ OTEL_EXPORTER_OTLP_ENDPOINT) exports spans
# over OTLP/HTTP. Without the feature the binary has no OpenTelemetry code.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
dhat = ["dep:dhat"]
# Opt-in mimalloc global allocator; default is the system (glibc) allocator.
mimalloc = ["dep:mimalloc"]



# `cyg-game` short alias — templates/docs isse reference karte hain
[[bin]]
name = "cyg-game"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# local auto-di checkout (register_instance API) until 0.6.1 is published
[patch.crates-io]
auto-di = { path = "../../rust/testing_dep/crates/auto-di" }

