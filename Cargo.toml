[workspace]
resolver = "2"
members = [
    ".",
    "crates/engine-agones",
    "crates/engine-bus",
    "crates/engine-config",
    "crates/engine-control",
    "crates/engine-core",
    "crates/engine-dashboard",
    "crates/engine-guest",
    "crates/engine-http",
    "crates/engine-net",
    "crates/engine-physics",
    "crates/engine-protocol",
    "crates/engine-server",
    "crates/engine-spatial",
    "crates/engine-wasm",
    "crates/engine-websocket",
    "crates/engine-webrtc-protocol",
    "crates/engine-webtransport",
    "crates/engine-voice",
    "crates/engine-lua",
]

[package]
name = "openoxide-gaming"
version = "0.1.0"
edition = "2024"

[dependencies]
engine-bus = { path = "crates/engine-bus" }
engine-config = { path = "crates/engine-config" }
engine-control = { path = "crates/engine-control" }
engine-server = { path = "crates/engine-server" }
engine-physics = { path = "crates/engine-physics" }
engine-protocol = { path = "crates/engine-protocol" }
engine-spatial = { path = "crates/engine-spatial" }
engine-wasm = { path = "crates/engine-wasm" }
wasmtime = "25.0.0"
hmac = "0.12"
sha2 = "0.10"


