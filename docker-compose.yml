services:
  postgres:
    image: orioledb/orioledb:latest-pg17
    container_name: cyg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyg
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: cyg_db
    ports:
      - "5432:5432"
    shm_size: 1gb
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cyg_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
    driver: local
  redis_data:
