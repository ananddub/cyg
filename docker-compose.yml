services:
  postgres:
    image: orioledb/orioledb:latest-pg17
    container_name: openoxide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openoxide
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: openoxide_db
    ports:
      - "5432:5432"
    shm_size: 1gb
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-oriole.sql:/docker-entrypoint-initdb.d/init-oriole.sql:ro

  redis:
    image: redis:7
    container_name: openoxide_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
    driver: local
  redis_data:
