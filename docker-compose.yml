services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb_server
    restart: unless-stopped
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    command: start --user root --pass root surrealkv:/data/cyg

  server:
    image: fedora:latest
    container_name: openoxide_gaming
    restart: unless-stopped
    stop_signal: SIGINT
    working_dir: /app
    depends_on:
      - surrealdb
    ports:
      - "19224:19224"       # Control Plane: HTTP API, WebSockets (/ws/signal), Dashboard (/dashboard/), Matchmaking
      - "7977:7977/udp"     # WebRTC DataChannel (Fast UDP game state & inputs)
      - "7778:7778/udp"     # Native Engine (Unity / Unreal / Godot UDP datagrams)
      - "7978:7978/udp"     # QUIC/WebTransport (browser clients without WebRTC)
    environment:
      - OX_ALLOW_DEFAULT_SECRETS=1
      - RUST_LOG=info
      - GAME_DIR=examples/orbioo-agario
      - SURREAL_ENDPOINT=ws://surrealdb:8000
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NS=cyg
      - SURREAL_DB=cyg
    volumes:
      - .:/app
      - ./data:/app/data
    entrypoint: ["/bin/bash", "/app/deploy/entrypoint.sh"]

